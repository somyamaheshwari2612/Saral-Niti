services:
  # Backend API Service (Deploy on Render)
  - type: web
    name: saral-niti-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/seed_db.py
    startCommand: gunicorn app:app --workers 2 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://your-domain.vercel.app

