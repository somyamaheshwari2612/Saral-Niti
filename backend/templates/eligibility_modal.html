<!-- ══════════════ ELIGIBILITY CHECKER MODAL ══════════════ -->
<div class="modal-overlay" id="eligibilityOverlay" onclick="closeEligibilityOnOverlay(event)" role="dialog" aria-modal="true">
  <div class="modal eligibility-modal">
    <div class="modal-header">
      <button class="modal-close" onclick="closeEligibilityModal()" aria-label="Close modal">✕</button>
      <div class="modal-category"><i class="fa-solid fa-wand-magic-sparkles"></i> Personalization Engine</div>
      <h2 class="modal-title">Find Schemes You Are Eligible For</h2>
      <div class="modal-ministry">Instant, rules-based welfare scheme recommendations with transparent matching criteria</div>
    </div>
    
    <div class="modal-body">
      <!-- FORM -->
      <form id="eligibilityForm" onsubmit="handleEligibilitySubmit(event)">
        <div class="elig-form-grid">
          <div class="form-group">
            <label for="eligAge"><i class="fa-solid fa-cake-candles"></i> Age (Years)</label>
            <input type="number" id="eligAge" name="age" min="0" max="120" placeholder="e.g. 24" required>
          </div>

          <div class="form-group">
            <label for="eligGender"><i class="fa-solid fa-venus-mars"></i> Gender</label>
            <select id="eligGender" name="gender">
              <option value="all">Any / Prefer not to say</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="transgender">Transgender</option>
            </select>
          </div>

          <div class="form-group">
            <label for="eligState"><i class="fa-solid fa-location-dot"></i> State / UT</label>
            <select id="eligState" name="state">
              <option value="all">All India (Central + State)</option>
              <option value="Andhra Pradesh">Andhra Pradesh</option>
              <option value="Arunachal Pradesh">Arunachal Pradesh</option>
              <option value="Assam">Assam</option>
              <option value="Bihar">Bihar</option>
              <option value="Chhattisgarh">Chhattisgarh</option>
              <option value="Goa">Goa</option>
              <option value="Gujarat">Gujarat</option>
              <option value="Haryana">Haryana</option>
              <option value="Himachal Pradesh">Himachal Pradesh</option>
              <option value="Jharkhand">Jharkhand</option>
              <option value="Karnataka">Karnataka</option>
              <option value="Kerala">Kerala</option>
              <option value="Madhya Pradesh">Madhya Pradesh</option>
              <option value="Maharashtra">Maharashtra</option>
              <option value="Manipur">Manipur</option>
              <option value="Meghalaya">Meghalaya</option>
              <option value="Mizoram">Mizoram</option>
              <option value="Nagaland">Nagaland</option>
              <option value="Odisha">Odisha</option>
              <option value="Punjab">Punjab</option>
              <option value="Rajasthan">Rajasthan</option>
              <option value="Sikkim">Sikkim</option>
              <option value="Tamil Nadu">Tamil Nadu</option>
              <option value="Telangana">Telangana</option>
              <option value="Tripura">Tripura</option>
              <option value="Uttar Pradesh">Uttar Pradesh</option>
              <option value="Uttarakhand">Uttarakhand</option>
              <option value="West Bengal">West Bengal</option>
              <option value="Delhi">Delhi (NCT)</option>
              <option value="Jammu and Kashmir">Jammu and Kashmir</option>
              <option value="Ladakh">Ladakh</option>
              <option value="Puducherry">Puducherry</option>
            </select>
          </div>

          <div class="form-group">
            <label for="eligIncome"><i class="fa-solid fa-indian-rupee-sign"></i> Annual Family Income (₹)</label>
            <input type="number" id="eligIncome" name="income" min="0" step="5000" placeholder="e.g. 200000">
          </div>

          <div class="form-group">
            <label for="eligCaste"><i class="fa-solid fa-users"></i> Social Category</label>
            <select id="eligCaste" name="caste">
              <option value="general">General</option>
              <option value="obc">OBC</option>
              <option value="sc">SC</option>
              <option value="st">ST</option>
              <option value="minority">Minority Communities</option>
              <option value="dnt">Denotified Tribes (DNT)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="eligOccupation"><i class="fa-solid fa-briefcase"></i> Primary Occupation</label>
            <select id="eligOccupation" name="occupation">
              <option value="">Select occupation...</option>
              <option value="farmer">Farmer / Agricultural Worker</option>
              <option value="student">Student / Aspirant</option>
              <option value="unemployed">Unemployed / Jobseeker</option>
              <option value="daily_wage">Daily Wage / Construction Worker</option>
              <option value="salaried">Salaried Employee</option>
              <option value="self_employed">Self Employed / Artisan</option>
              <option value="business">Small Business / MSME Owner</option>
            </select>
          </div>

          <div class="form-group">
            <label for="eligEducation"><i class="fa-solid fa-graduation-cap"></i> Education Level</label>
            <select id="eligEducation" name="education_level">
              <option value="">Any Education Level</option>
              <option value="illiterate">Illiterate / No Formal Schooling</option>
              <option value="below_10th">Below 10th (Primary / Middle)</option>
              <option value="10th">10th Pass (Matriculation)</option>
              <option value="12th">12th Pass (10+2 / Intermediate)</option>
              <option value="graduate">Graduate (Degree / Bachelors)</option>
              <option value="postgraduate">Postgraduate (Masters / PhD)</option>
              <option value="vocational">Vocational / ITI / Polytechnic</option>
            </select>
          </div>

          <div class="form-group">
            <label for="eligRation"><i class="fa-solid fa-id-card"></i> Ration Card Holding</label>
            <select id="eligRation" name="ration_card">
              <option value="">None / Not Applicable</option>
              <option value="aay">Antyodaya Anna Yojana (AAY)</option>
              <option value="bpl">Below Poverty Line (BPL)</option>
              <option value="phh">Priority Household (PHH)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="eligHousing"><i class="fa-solid fa-house"></i> Housing Status</label>
            <select id="eligHousing" name="housing_status">
              <option value="">Any Housing Status</option>
              <option value="homeless">Homeless / Destitute / Shelter</option>
              <option value="kutcha">Kutcha House (Temporary / Mud)</option>
              <option value="pucca">Pucca House (Permanent structure)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="eligLand"><i class="fa-solid fa-tractor"></i> Land Holding</label>
            <select id="eligLand" name="land_ownership">
              <option value="">None / Not a Farmer</option>
              <option value="landless">Landless / Agri Laborer</option>
              <option value="marginal">Marginal Farmer (&lt; 1 Hectare)</option>
              <option value="small">Small Farmer (1–2 Hectares)</option>
              <option value="large">Large Farmer (&gt; 2 Hectares)</option>
            </select>
          </div>
        </div>

        <div class="elig-checkboxes">
          <label class="checkbox-label">
            <input type="checkbox" id="eligIsStudent" name="is_student">
            <span>Currently enrolled student</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="eligIsDisabled" name="is_differently_abled">
            <span>♿ Persons with Disabilities (Divyangjan)</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="eligIsWidow" name="is_widow">
            <span>Widow</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="eligIsSingleWomen" name="is_single_women">
            <span>Single Woman / Destitute</span>
          </label>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary" id="eligSubmitBtn">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Find Eligible Schemes</span>
          </button>
          <button type="button" class="btn-secondary" onclick="closeEligibilityModal()">Cancel</button>
        </div>
      </form>

      <!-- RESULTS CONTAINER -->
      <div id="eligResultsWrap" style="display: none; margin-top: 24px;">
        <div class="elig-results-header">
          <h3 id="eligResultsTitle">Matched Schemes</h3>
          <p id="eligResultsSub">Schemes ranked by eligibility fit and verification status</p>
        </div>
        <div id="eligResultsList" class="elig-results-grid"></div>
      </div>
    </div>
  </div>
</div>
